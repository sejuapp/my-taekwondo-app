<mat-card-custom>
  <mat-card-header>
    <mat-card-title>Opciones del match</mat-card-title>
    <mat-card-subtitle>
      Se muestran las diferentes opciones que existen para el match seleccionado
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-dialog-content>
      <mat-accordion multi>
        @for (item of itemBracketsSelect()?.customOpponents; track $index; let i = $index) {
        <mat-expansion-panel expanded="true">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon class="opponent-icon">person</mat-icon>
              Oponente {{ i + 1 }}
            </mat-panel-title>
            <mat-panel-description>
              {{ item?.match?.name }} - {{ item?.match?.result }}
            </mat-panel-description>
          </mat-expansion-panel-header>

          <app-info-oponentes-1 [persona]="item?.participant?.persona ?? null"></app-info-oponentes-1>


          <!-- Botón de acción -->
          <div>
            @if(item?.participant){
            <button mat-flat-button color="primary" class="compact-button" (click)="onCambiarCompetidor(item)">
              <mat-icon>swap_horiz</mat-icon>
              Cambiar
            </button>
            }
          </div>
        </mat-expansion-panel>
        }
      </mat-accordion>
    </mat-dialog-content>
  </mat-card-content>

  <mat-card-actions class="custom-actions">
    <button mat-button (click)="cerrar()">Cerrar</button>
  </mat-card-actions>
</mat-card-custom>
