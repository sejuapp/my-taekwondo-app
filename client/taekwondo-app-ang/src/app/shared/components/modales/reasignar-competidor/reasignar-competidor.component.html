<mat-card-custom>
  <mat-card-header>
    <mat-card-title>Emparejamiento</mat-card-title>
    <mat-card-subtitle>Se realiza el emparejamiento de los competidores</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-dialog-content>


      <p>Bienvenido <strong>{{ data.usuario }}</strong> 👋</p>

      <h3>Lista de materias:</h3>
      <ul>
        <li *ngFor="let materia of data.materias">{{ materia }}</li>
      </ul>
    </mat-dialog-content>
  </mat-card-content>
  <mat-card-actions class="custom-actions">
    <button mat-button (click)="cerrar()">Cerrar</button>
  </mat-card-actions>
</mat-card-custom>
