<mat-card-custom>
  <mat-card-header>
    <mat-card-title>Cambiar competidor</mat-card-title>
    <mat-card-subtitle>Se realiza el cambio del oponente seleccionado</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>

    <mat-icon>sports_martial_arts</mat-icon>
    <mat-icon>monitor_weight</mat-icon>
    <mat-icon>height</mat-icon>

    <mat-dialog-content>
      <strong>{{ competidorAntiguo()?.bracket?.name }}</strong>
      <br /><br />

      <mat-list>
        @for (item of competidoresRonda(); track item.bracket.id) {
        <mat-list-item>
          <span matListItemTitle>{{ item?.bracket?.name }}</span>
          <button mat-icon-button matListItemMeta type="button" (click)="onCambiarCompetidor(item)">
            <mat-icon>swap_horiz</mat-icon>
          </button>
        </mat-list-item>
        <mat-divider class="divider-spacing"></mat-divider>
        }
      </mat-list>

    </mat-dialog-content>
  </mat-card-content>

  <mat-card-actions class="custom-actions">
    <button mat-button (click)="cerrar()">Cerrar</button>
  </mat-card-actions>
</mat-card-custom>
