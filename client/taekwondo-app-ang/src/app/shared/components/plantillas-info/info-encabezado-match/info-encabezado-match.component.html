<div class="row">
  @for (item of itemBracketsSelect()?.customOpponents; track $index) {
  <div class="col-12 col-md-6 mb-3">
    <div class="opponent-card" [class.red-accent]="$index === 1">
      <div class="opponent-card-content">
        <div class="opponent-header">
          <div class="opponent-info">
            <!-- opponent number -->
            <div class="opponent-number" [class.winner-color-number]="isWinner(item)">
              <mat-icon class="opponent-small-icon" [ngClass]="$index === 0 ? 'blue' : 'red'">person</mat-icon>
              Oponente {{ $index + 1 }}

              <strong *ngIf="isWinner(item)" class="winner-color-txt">
                - (Ganador)
              </strong>

              <div class="flex-grow-1 text-end">
                <mat-icon class="pointer" [matMenuTriggerFor]="menu1" (click)="onMenuIconClick(item)">
                  more_vert
                </mat-icon>
              </div>

            </div>

            <!-- opponent name -->
            <div class="opponent-name" [innerHTML]="obtenerNombreYClub(item)"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
  }
</div>

<mat-menu #menu1="matMenu">

  <div class="menu-content">

    @if(sePuedeCambiar()){
    <button mat-menu-item (click)="onCambiarCompetidor()">Cambiar oponente</button>
    }

    @if (!existeGanador()) {
    <button mat-menu-item (click)="onDeclararGanador()">Declarar ganador</button>
    }


  </div>

</mat-menu>
