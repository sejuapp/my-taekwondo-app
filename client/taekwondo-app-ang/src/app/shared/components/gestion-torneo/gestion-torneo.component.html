<div [id]="torneoId" class="brackets-viewer"></div>

<br>

<button #menuTrigger="matMenuTrigger" [matMenuTriggerFor]="menu1"
  [ngStyle]="{ position: 'fixed', top: menuTopLeft.y, left: menuTopLeft.x, opacity: 0, pointerEvents: 'none' }">
</button>

<mat-menu #menu1="matMenu" yPosition="above" xPosition="after" [overlapTrigger]="false">
  <div class="menu-content" (click)="$event.stopPropagation()">
    <p>
      {{ itemBracketsSelect?.opponent1?.name }} vs
      {{ itemBracketsSelect?.opponent2?.name }}
    </p>
  </div>
</mat-menu>
