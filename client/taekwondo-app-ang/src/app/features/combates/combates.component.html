<mat-card-custom>
  <mat-card-header>
    <mat-card-title>Emparejamiento</mat-card-title>
    <mat-card-subtitle>Se realiza el emparejamiento de los competidores</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="custom-content">

    <div fxLayout="row" fxLayoutGap="16px" fxLayout.lt-sm="column">
      <mat-form-field fxFlex="50" fxFlex.lt-sm="100">
        <mat-label>Campo 1</mat-label>
        <input matInput>
      </mat-form-field>

      <mat-form-field fxFlex="50" fxFlex.lt-sm="100">
        <mat-label>Campo 2</mat-label>
        <input matInput>
      </mat-form-field>
    </div>

    <div>
      <mat-form-field fxFlex="100">
        <mat-label>Campo 3</mat-label>
        <input matInput>
      </mat-form-field>
    </div>


  </mat-card-content>
  <mat-card-actions class="custom-actions">
    <button mat-raised-button color="primary">Aceptar</button>
    <button mat-raised-button color="warn">Cancelar</button>
  </mat-card-actions>
</mat-card-custom>
